<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turnstile Board</title>
<meta name="description" content="Epic delivery state: PRs, stories, bugs and what waits for humans.">
<style>
:root { --bg:#f6f7f9; --card:#fff; --ink:#1c1f24; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb;
  --dev:#9ca3af; --ai:#f59e0b; --ready:#10b981; --human:#3b82f6; --rework:#ef4444; --approved:#8b5cf6; --merged:#4b5563; --planned:#9ca3af; --progress:#f59e0b; --integ:#3b82f6; --env:#8b5cf6; --done:#10b981; --todo:#ef4444; --bugai:#f59e0b; --testing:#3b82f6; --aged:#fdf3dc; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f1115; --card:#171a21; --ink:#e5e7eb; --muted:#9ca3af; --line:#2a2f3a; --aged:#2b2416; } }
:root[data-theme="dark"] { --bg:#0f1115; --card:#171a21; --ink:#e5e7eb; --muted:#9ca3af; --line:#2a2f3a; --aged:#2b2416; }
* { box-sizing:border-box } body { margin:0; padding:16px; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif }
h1 { font-size:20px; margin:0 0 4px } .updated { color:var(--muted); font-size:12px; margin-bottom:12px }
.tiles { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px } .tile { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px; min-width:110px }
.tile b { display:block; font-size:22px } .tile span { color:var(--muted); font-size:12px }
button.tile { font:inherit; text-align:left; color:inherit; cursor:pointer } .tile[aria-pressed="true"] { border-color:var(--accent) } .tile[aria-pressed="true"] b { color:var(--accent) }
.tile:disabled { opacity:.6; cursor:default } .filter { margin:0 0 8px; color:var(--muted); font-size:12px }
h2 { font-size:16px; margin:20px 0 8px } .scroll { overflow-x:auto } table { border-collapse:collapse; width:100%; background:var(--card); border:1px solid var(--line); border-radius:8px }
th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; font-size:13px } th { color:var(--muted); font-weight:600 }
.badge { display:inline-block; padding:1px 8px; border-radius:999px; color:#fff; font-size:11px; font-weight:600 }
.k { font-family: ui-monospace, Menlo, monospace; font-size:12px } .muted { color:var(--muted) } a { color:var(--accent) }
.tabs button { background:none; border:1px solid var(--line); border-radius:6px; padding:4px 10px; margin-right:6px; color:var(--ink); cursor:pointer } .tabs button.on { border-color:var(--accent); color:var(--accent) }
select.bug { font:inherit; font-size:12px; padding:2px 6px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--ink) }
select.bug:disabled { opacity:.7 } .manual { display:block; color:var(--muted); font-size:11px }
.hidden { display:none } .legend { color:var(--muted); font-size:12px; margin-top:16px } .legend b { color:var(--ink) }
.cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:8px; margin-bottom:16px } .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px }
.card h3 { font-size:13px; margin:0 0 6px; display:flex; justify-content:space-between } .card h3 span { color:var(--muted); font-weight:400 }
svg.sbar { display:block; width:100%; margin:4px 0 } svg.sbar rect { stroke:var(--card); stroke-width:2 } svg.sbar rect.track { fill:var(--line) }
svg.sbar rect[data-state] { cursor:pointer } svg.sbar rect[data-state]:focus-visible { stroke:var(--accent); outline:none }
.keys { color:var(--muted); font-size:12px } .keys span { display:inline-block; margin-right:10px; white-space:nowrap } .keys i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:baseline }
.bar-cell { min-width:200px } tr.aged td { background:var(--aged) } td.num { text-align:right; font-variant-numeric:tabular-nums }
details { margin-top:12px } summary { cursor:pointer; color:var(--muted); font-size:13px }
</style>
</head>
<body>
<h1 id="title">Turnstile</h1>
<div class="updated">updated __TURNSTILE_UPDATED__</div>
<div class="updated" id="members"></div>
<div class="tiles" id="tiles">
<button type="button" class="tile" data-tile="DEV" aria-pressed="false"><b>0</b><span>DEV</span></button><button type="button" class="tile" data-tile="AI_REVIEW" aria-pressed="false"><b>0</b><span>AI_REVIEW</span></button><button type="button" class="tile" data-tile="READY" aria-pressed="false"><b>0</b><span>READY</span></button><button type="button" class="tile" data-tile="ON_HUMAN_REVIEW" aria-pressed="false"><b>0</b><span>ON_HUMAN_REVIEW</span></button><button type="button" class="tile" data-tile="REWORK" aria-pressed="false"><b>0</b><span>REWORK</span></button><button type="button" class="tile" data-tile="APPROVED" aria-pressed="false"><b>0</b><span>APPROVED</span></button><button type="button" class="tile" data-tile="MERGED" aria-pressed="false"><b>0</b><span>MERGED</span></button>
<button type="button" class="tile" data-tile="stories"><b>0</b><span>Stories</span></button><button type="button" class="tile" data-tile="bugs" aria-pressed="false"><b>0</b><span>Open bugs</span></button><button type="button" class="tile" data-tile="awaiting"><b>0</b><span>Awaiting humans</span></button>
</div>
<div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="prs" class="on">PRs</button><button role="tab" aria-selected="false" data-tab="stories">Stories</button><button role="tab" aria-selected="false" data-tab="bugs">Bugs</button><button role="tab" aria-selected="false" data-tab="awaiting">Awaiting humans</button><button role="tab" aria-selected="false" data-tab="progress">Progress</button></div>
<div id="prs" role="tabpanel"></div><div id="stories" class="hidden" role="tabpanel"></div><div id="bugs" class="hidden" role="tabpanel"></div><div id="awaiting" class="hidden" role="tabpanel"></div><div id="progress" class="hidden" role="tabpanel"></div>
<div class="legend" id="legend"></div>
<script>
const STATE = /*__TURNSTILE_STATE__*/null;
const COLORS = { DEV:'var(--dev)', AI_REVIEW:'var(--ai)', READY:'var(--ready)', ON_HUMAN_REVIEW:'var(--human)', REWORK:'var(--rework)', APPROVED:'var(--approved)', MERGED:'var(--merged)' };
const PR_STATES = Object.keys(COLORS);
const TABS = ['prs', 'stories', 'bugs', 'awaiting', 'progress'];
const STORY_STATES = ['PLANNED', 'IN_PROGRESS', 'INTEGRATION_REVIEW', 'ENV_TESTING', 'DONE'];
const UPDATED = '__TURNSTILE_UPDATED__';
function renderMembers() {
  const v = STATE.view;
  if (v) {
    document.getElementById('title').textContent = 'Turnstile — ' + (STATE.epic || {}).key + ' — ' + v.name;
    document.getElementById('members').textContent = v.name + ' · variant ' + (v.variant || 'none') + ' · desk ' + (v.desk || 'none') + '  |  full board: ' + (v.full || 'board.html');
    return;
  }
  const list = Object.entries((STATE.epic || {}).members || {});
  document.getElementById('members').textContent = list.length ? 'members: ' + list.map(([login, m]) => login + ' · ' + ((m && m.variant) || 'no variant') + ' · ' + ((m && m.desk) || 'no desk')).join('  |  ') : '';
}
let view = { tab: 'prs', state: null, open: false };
Object.assign(COLORS, { PLANNED:'var(--planned)', IN_PROGRESS:'var(--progress)', INTEGRATION_REVIEW:'var(--integ)', ENV_TESTING:'var(--env)', DONE:'var(--done)', todo:'var(--todo)', ai:'var(--bugai)', testing:'var(--testing)', done:'var(--done)' });
const JIRA = { DEV:'In progress', AI_REVIEW:'In progress', READY:'In progress', ON_HUMAN_REVIEW:'On Review', REWORK:'On Review', APPROVED:'On Review', MERGED:'On Hold' };
function note(p) {
  const h = (p.evidence || {}).human || {}, out = [];
  if (p.state === 'REWORK') {
    out.push('reviewer not notified' + (h.sent_head && p.head && !(p.head.startsWith(h.sent_head) || h.sent_head.startsWith(p.head)) ? ' (new head)' : ''));
    const nl = Object.values(p.threads || {}).filter(t => t && t.class === 'needs_lead').length;
    if (nl) out.push(nl + ' thread(s) need the lead');
  }
  if (p.state === 'ON_HUMAN_REVIEW' && h.reviewer_notified === false) out.push('reviewers not notified (push-only rework: the lead decides)');
  if (p.state === 'ON_HUMAN_REVIEW' && h.reviewer_notified === true && h.rerequested) out.push((h.rerequested.logins || []).length ? 're-requested ' + h.rerequested.logins.join(', ') + ' on ' + short(h.rerequested.head)
    : 'not re-requested: ' + (h.rerequested.approved || []).join(', ') + ' approved ' + short(h.rerequested.head));
  if ((h.approvals || []).length) out.push('approved by ' + h.approvals.join(', '));
  if (h.answered_threads > 0) out.push(h.answered_threads + ' thread(s) answered, awaiting resolve');
  if (p.state === 'READY' && p.blocked_by) out.push('waits for ' + p.blocked_by);
  if (p.last_reason) out.push(p.last_reason);
  return out.join(' · ');
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const badge = s => '<span class="badge" style="background:' + (COLORS[s] || 'var(--muted)') + '">' + esc(s) + '</span>';
const prUrl = id => { const [repo, n] = id.split('#'); const org = ((STATE || {}).epic || {}).github_org; return org ? 'https://github.com/' + org + '/' + repo + '/pull/' + n : '#'; };
const jiraBase = () => String(((STATE || {}).epic || {}).jira_base_url || '').replace(/\/+$/, '');
const ticket = k => k && /^[A-Z][A-Z0-9]+-\d+$/.test(k) && /^https:\/\//.test(jiraBase()) ? '<a href="' + esc(jiraBase() + '/browse/' + k) + '" target="_blank" rel="noopener">' + esc(k) + '</a>' : esc(k);
const tickets = s => (s.tickets || []).map(ticket).join(' ');
const short = h => h ? String(h).slice(0, 8) : '—';
const pressed = k => (view.tab === 'prs' && view.state === k) || (view.tab === 'bugs' && view.open && k === 'bugs');
function tiles() {
  const prs = Object.values(STATE.prs || {});
  const n = { stories: Object.keys(STATE.stories || {}).length, bugs: openBugs(), awaiting: (STATE.awaiting_human || []).filter(openEntry).length };
  PR_STATES.forEach(s => { n[s] = prs.filter(p => p.state === s).length; });
  document.querySelectorAll('#tiles .tile').forEach(b => {
    const k = b.dataset.tile, on = pressed(k);
    b.querySelector('b').textContent = n[k] || 0; if (b.hasAttribute('aria-pressed')) b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.disabled = !n[k] && !on;
  });
}
function tileClick(k) {
  if (PR_STATES.includes(k)) { view.state = pressed(k) ? null : k; view.tab = 'prs'; }
  else if (k === 'bugs') { view.open = !pressed(k); view.tab = 'bugs'; }
  else if (TABS.includes(k)) view.tab = k;
  show(); writeHash();
}
function show() {
  document.querySelectorAll('.tabs button').forEach(x => { const on = x.dataset.tab === view.tab; x.classList.toggle('on', on); x.setAttribute('aria-selected', on ? 'true' : 'false'); });
  TABS.forEach(id => document.getElementById(id).classList.toggle('hidden', id !== view.tab));
  prs(); renderBugs();
}
function writeHash() {
  const h = '#tab=' + view.tab + (view.tab === 'prs' && view.state ? '&state=' + view.state : '') + (view.tab === 'bugs' && view.open ? '&open=1' : '');
  try { history.replaceState(null, '', location.pathname + location.search + h); } catch (e) {}
}
function applyHash() {
  const q = new URLSearchParams(location.hash.slice(1)), tab = q.get('tab'), state = q.get('state');
  if (TABS.includes(tab)) view.tab = tab;
  view.state = PR_STATES.includes(state) ? state : null; view.open = q.get('open') === '1';
  show();
}
function gateCell(p) {
  const e = p.evidence || {}, cur = p.head;
  const mark = (name, ev, ok) => ev ? (name + ' ' + (ok && ev.head && cur && (cur.startsWith(ev.head) || ev.head.startsWith(cur)) ? '✓' : '✗') + ' ' + short(ev.head)) : name + ' —';
  return [mark('deep', e.deep_review, e.deep_review && e.deep_review.clean), mark(e.gate ? e.gate.name : 'gate', e.gate, e.gate && e.gate.result === 'pass'),
          e.copilot ? mark('copilot', e.copilot, e.copilot.open_threads === 0) : ''].filter(Boolean).join(' · ');
}
const jiraAssignee = p => { const a = (p.jira || {}).assignee; return a ? ' · ' + esc(a.name || a.account_id) : ' <span class="muted">· unassigned</span>'; };
function prs() {
  const byRepo = {};
  Object.entries(STATE.prs || {}).filter(([, p]) => !view.state || p.state === view.state).forEach(([id, p]) => { const r = id.split('#')[0]; (byRepo[r] = byRepo[r] || []).push([id, p]); });
  const filter = view.state ? '<p class="filter">Showing ' + esc(view.state) + ' only · <a href="#" id="show-all">show all</a></p>' : '';
  document.getElementById('prs').innerHTML = filter + Object.entries(byRepo).map(([repo, rows]) =>
    '<h2>' + esc(repo) + '</h2><div class="scroll"><table><thead><tr><th>Ticket</th><th>PR</th><th>Owner</th><th>Slack</th><th>State</th><th>AI gates (head)</th><th>Blocked by</th><th>Jira</th><th>Next action</th><th>Note</th></tr></thead><tbody>' +
    rows.sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true })).map(([id, p]) => {
      const h = (p.evidence || {}).human || {};
      return '<tr><td>' + ticket(p.ticket) + '</td><td class="k"><a href="' + esc(prUrl(id)) + '" target="_blank" rel="noopener">#' + esc(id.split('#')[1]) + '</a> <span class="muted">' + short(p.head) + '</span></td>' +
        '<td class="k">' + esc(p.owner || '—') + '</td>' +
        '<td>' + (/^https:\/\//.test(h.slack_permalink || '') ? '<a href="' + esc(h.slack_permalink) + '" target="_blank" rel="noopener">thread ↗</a>' : '—') + '</td>' +
        '<td>' + badge(p.state) + '</td><td class="k">' + esc(gateCell(p)) + '</td><td class="k">' + esc(p.blocked_by || '—') + '</td>' +
        '<td>' + esc((p.jira || {}).status || '—') + ((p.jira || {}).synced === false ? ' <span class="muted">(not synced)</span>' : '') + jiraAssignee(p) + '</td><td>' + esc(p.next_action) + '</td><td class="muted">' + esc(note(p)) + '</td></tr>';
    }).join('') + '</tbody></table></div>').join('');
  const all = document.getElementById('show-all');
  if (all) all.addEventListener('click', e => { e.preventDefault(); view.state = null; show(); writeHash(); document.querySelector('.tabs button[data-tab="prs"]').focus(); });
}
function gateMarks(s) {
  const e = s.evidence || {}, trunk = s.mode === 'trunk';
  const runMark = r => r ? ((((r.cases || {}).fail === 0) && (r.figma_parity === 'pass' || (r.arm === 'control' && r.figma_parity === 'not_testable_here'))) ? '✓' : '✗ ' + ((r.cases || {}).fail == null ? '?' : r.cases.fail) + ' fail') + (r.full ? '' : ' (partial)') : '—';
  const lastArm = a => (e.env_runs || []).filter(r => (r.arm || 'treatment') === a).slice(-1)[0];
  return ['deploy ' + (e.deploy ? e.deploy.build : '—'), 'review ' + (e.integration_review ? (e.integration_review.clean ? '✓' : '✗') : '—')]
    .concat(trunk ? ['treatment ' + runMark(lastArm('treatment')), 'control ' + runMark(lastArm('control'))] : ['env ' + runMark(e.env_test)]).join(' · ');
}
function stories() {
  document.getElementById('stories').innerHTML = '<div class="scroll"><table><thead><tr><th>Story</th><th>Owner</th><th>State</th><th>PRs</th><th>Evidence</th><th>Next action</th></tr></thead><tbody>' +
    Object.entries(STATE.stories || {}).map(([sid, s]) => {
      const prs = Object.entries(STATE.prs || {}).filter(([, p]) => p.story === sid).map(([id, p]) => esc(id) + ' ' + badge(p.state)).join('<br>');
      const mode = s.mode === 'trunk' ? '<br><span class="muted">trunk · flag ' + esc((STATE.epic || {}).flag || 'none') + '</span>' : '';
      return '<tr><td><b>' + esc(sid) + '</b> ' + esc(s.title) + (tickets(s) ? '<br><span class="k">' + tickets(s) + '</span>' : '') + mode + '</td><td class="k">' + esc(s.owner || '—') + '</td><td>' + badge(s.state) + '</td><td>' + prs + '</td><td class="k">' + esc(gateMarks(s)) + '</td><td>' + esc(s.next_action) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}
const countBy = (items, order) => { const n = {}; order.forEach(k => { n[k] = 0; }); items.forEach(i => { if (i.state in n) n[i.state] += 1; }); return n; };
function stackBar(counts, order, h, link) {
  const total = order.reduce((n, k) => n + counts[k], 0), r = Math.min(4, h / 2);
  if (!total) return '<svg class="sbar" height="' + h + '" role="img" aria-label="none"><rect class="track" width="100%" height="' + h + '" rx="' + r + '"></rect></svg>';
  let x = 0;
  const label = order.filter(k => counts[k]).map(k => k + ' ' + counts[k]).join(', ');
  return '<svg class="sbar" height="' + h + '" role="img" aria-label="' + esc(label) + '">' + order.filter(k => counts[k]).map(k => {
    const w = counts[k] / total * 100, sx = x; x += w;
    return '<rect x="' + sx + '%" width="' + w + '%" height="' + h + '" rx="' + r + '" fill="' + COLORS[k] + '"' + (link ? ' data-state="' + esc(k) + '" tabindex="0" role="button"' : '') +
      '><title>' + esc(k) + ' · ' + counts[k] + (link ? ' (all ' + esc(k) + ' PRs)' : '') + '</title></rect>';
  }).join('') + '</svg>';
}
const keys = (counts, order) => '<div class="keys">' + order.map(k => '<span><i style="background:' + COLORS[k] + '"></i>' + esc(k) + ' ' + counts[k] + '</span>').join('') + '</div>';
function meter(n, N) {
  const pct = N ? Math.round(n / N * 100) : 0;
  return '<svg class="sbar" height="8" role="img" aria-label="' + pct + '%"><rect class="track" width="100%" height="8" rx="4"></rect>' + (pct ? '<rect width="' + pct + '%" height="8" rx="4" fill="var(--accent)"></rect>' : '') + '</svg>';
}
const tsIso = s => { const m = /^(\d{4}-\d\d-\d\dT\d\d:\d\d)Z$/.exec(s || ''); return ts(m ? m[1] + ':00Z' : s); };
function since(p) {
  if (p.state_since) return p.state_since;
  const e = p.evidence || {}, cands = [(p.rework_since || {}).at, (e.human || {}).returned_at, (e.human || {}).sent_at, (e.head_verified || {}).at].filter(x => tsIso(x));
  return cands.length ? cands.sort((a, b) => tsIso(b) - tsIso(a))[0] : null;
}
const AGE_STATES = ['REWORK', 'ON_HUMAN_REVIEW', 'READY'];
function progress() {
  const stories = Object.entries(STATE.stories || {}), prs = Object.entries(STATE.prs || {}), bugs = STATE.bugs || [];
  const sc = countBy(stories.map(([, s]) => s), STORY_STATES), pc = countBy(prs.map(([, p]) => p), PR_STATES);
  const pct = (n, N) => N ? Math.round(n / N * 100) + '%' : '—';
  const card = (title, n, N, counts, order) => '<div class="card"><h3>' + title + ' ' + n + ' / ' + N + '<span>' + pct(n, N) + '</span></h3>' + meter(n, N) + stackBar(counts, order, 16, false) + keys(counts, order) + '</div>';
  const rows = stories.map(([sid, s]) => {
    const mine = prs.filter(([, p]) => p.story === sid).map(([, p]) => p), c = countBy(mine, PR_STATES);
    return '<tr><td><b>' + esc(sid) + '</b> ' + esc(s.title) + (tickets(s) ? '<br><span class="k">' + tickets(s) + '</span>' : '') + '</td><td>' + badge(s.state) + '</td><td class="bar-cell">' + stackBar(c, PR_STATES, 8, true) + '<span class="muted">' + mine.length + ' PR' + (mine.length === 1 ? '' : 's') + '</span></td><td class="k">' + esc(gateMarks(s)) + '</td></tr>';
  });
  const open = prs.filter(([, p]) => p.state !== 'MERGED').map(([id, p]) => { const at = since(p), t = tsIso(at); return { id, p, at, days: t ? Math.max(0, Math.floor((Date.now() - t) / 86400000)) : null }; })
    .sort((a, b) => (b.days == null ? -1 : b.days) - (a.days == null ? -1 : a.days));
  const ageing = open.map(r => '<tr' + (r.days != null && r.days >= 3 && AGE_STATES.includes(r.p.state) ? ' class="aged"' : '') + '><td class="k"><a href="' + esc(prUrl(r.id)) + '" target="_blank" rel="noopener">' + esc(r.id) + '</a> ' + ticket(r.p.ticket) + '</td><td>' + badge(r.p.state) +
    '</td><td class="num">' + (r.days == null ? '—' : r.days) + '</td><td class="muted">' + esc(r.at || '—') + '</td></tr>');
  document.getElementById('progress').innerHTML =
    '<div class="cards">' + card('Stories DONE', sc.DONE, stories.length, sc, STORY_STATES) + card('PRs MERGED', pc.MERGED, prs.length, pc, PR_STATES) +
    '<div class="card"><h3>Bugs open ' + openBugs() + ' / ' + bugs.length + '<span>snapshot ' + esc(UPDATED) + '</span></h3></div></div>' +
    '<h2>Per story</h2><div class="scroll"><table><thead><tr><th>Story</th><th>State</th><th>PRs by state</th><th>Gates</th></tr></thead><tbody>' +
    (rows.join('') || '<tr><td colspan="4" class="muted">no stories yet</td></tr>') + '</tbody></table></div>' +
    '<h2>Ageing <span class="muted">(open PRs, days in state)</span></h2><div class="scroll"><table><thead><tr><th>PR</th><th>State</th><th>Days in state</th><th>Since</th></tr></thead><tbody>' +
    (ageing.join('') || '<tr><td colspan="4" class="muted">no open PRs</td></tr>') + '</tbody></table></div>';
}
const segmentClick = k => { tileClick(k); document.querySelector('.tabs button[data-tab="prs"]').focus(); };
document.getElementById('progress').addEventListener('click', e => { const r = e.target.closest('rect[data-state]'); if (r) segmentClick(r.dataset.state); });
document.getElementById('progress').addEventListener('keydown', e => { const r = e.target.closest && e.target.closest('rect[data-state]'); if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); segmentClick(r.dataset.state); } });
const BUG_STATES = ['todo', 'ai', 'testing', 'done'];
let bugOverrides = {}, bugsDb = null, bugsCanWrite = false, renderPending = false;
const ts = s => { const n = Date.parse(s || ''); return isNaN(n) ? 0 : n; };
// the db override renders only while it is newer than the bug in state.json (bug set / a reopen by a run record wins afterwards)
const bugState = b => { const o = bugOverrides[b.id]; return (o && BUG_STATES.includes(o.status) && ts(o.updatedAt) > ts(b.updated_at || b.created_at)) ? o.status : b.state; };
const openBugs = () => (STATE.bugs || []).filter(b => bugState(b) !== 'done').length;
function bugs() {
  const counts = {}; (STATE.bugs || []).forEach(b => { const k = bugState(b); counts[k] = (counts[k] || 0) + 1; });
  const filter = view.open ? '<p class="filter">Showing open bugs only · <a href="#" id="show-all-bugs">show all</a></p>' : '';
  document.getElementById('bugs').innerHTML = filter +
    '<div class="tiles">' + BUG_STATES.map(k => '<div class="tile"><b>' + (counts[k] || 0) + '</b><span>' + k + '</span></div>').join('') + '</div>' +
    '<div class="scroll"><table><thead><tr><th>#</th><th>Story</th><th>Case</th><th>Bug</th><th>Source</th><th>PR</th><th>Figma</th><th>State</th><th>Note</th></tr></thead><tbody>' +
    (STATE.bugs || []).filter(b => !view.open || bugState(b) !== 'done').map(b => {
      const cur = bugState(b);
      const manual = bugOverrides[b.id] ? '<span class="manual">changed ' + esc(String(bugOverrides[b.id].updatedAt || '').slice(0, 16).replace('T', ' ')) + '</span>' : '';
      return '<tr><td class="k">' + esc(b.id) + '</td><td>' + esc(b.story) + '</td><td class="k">' + esc(b.case || '—') + '</td><td>' + (b.ticket ? ticket(b.ticket) + ' ' : '') + esc(b.title) + '</td><td class="muted">' + esc(b.source) + '</td><td class="k">' +
        (b.pr ? '<a href="' + esc(prUrl(b.pr)) + '" target="_blank" rel="noopener">' + esc(b.pr) + '</a>' : '—') + '</td><td class="k">' + esc(b.figma || '—') + '</td>' +
        '<td>' + badge(cur) + ' <select class="bug" data-bug="' + esc(b.id) + '"' + (bugsCanWrite ? '' : ' disabled title="Status changes are saved by the board owner"') + '>' +
        BUG_STATES.map(k => '<option value="' + k + '"' + (k === cur ? ' selected' : '') + '>' + k + '</option>').join('') + '</select>' + manual + '</td>' +
        '<td>' + esc(b.note) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  const all = document.getElementById('show-all-bugs');
  if (all) all.addEventListener('click', e => { e.preventDefault(); view.open = false; show(); writeHash(); document.querySelector('.tabs button[data-tab="bugs"]').focus(); });
  document.querySelectorAll('select[data-bug]').forEach(sel => sel.addEventListener('change', async () => {
    if (!bugsDb) return;
    const id = sel.getAttribute('data-bug'), status = sel.value; sel.disabled = true;
    try { await bugsDb.doc('bugs/' + id).set({ status: status, updatedAt: new Date().toISOString() }); }
    catch (e) { sel.value = bugState((STATE.bugs || []).find(b => b.id === id) || { state: 'todo' }); }
    finally { sel.disabled = !bugsCanWrite; }
  }));
}
function renderBugs() {
  tiles();
  // a snapshot while the viewer holds a dropdown open must not destroy it: render once it closes
  const el = document.activeElement;
  if (el && el.matches && el.matches('select.bug')) {
    if (!renderPending) { renderPending = true; el.addEventListener('blur', () => { renderPending = false; renderBugs(); }, { once: true }); }
    return;
  }
  bugs(); progress();
}
async function connectBugsDb() {
  try {
    const db = await claude.use('db'); if (!db) return; bugsDb = db;
    const user = await claude.use('user'); const w = user ? await user.can('data.write') : null;
    bugsCanWrite = (w === null || w === undefined) ? true : !!w; bugs();
    db.collection('bugs').onSnapshot(snap => { const next = {}; for (const d of snap.docs) { if (d.exists) next[d.id] = d.data(); } bugOverrides = next; renderBugs(); }, () => {});
  } catch (e) { /* no db in this view */ }
}
const openEntry = a => a.type !== 'send' && !a.voided_at && !a.consumed_at && (!a.approved_at || (a.type === 'reply' && !a.posted_at));
const approveLine = a => '! TURNSTILE_LEAD=1 turnstile approve ' + a.id;
function awaitingRow(a) {
  const subject = esc(a.pr || a.story || a.payload) + (a.thread ? ' ' + esc(a.thread) : '') + (a.ticket || ((STATE.prs || {})[a.pr] || {}).ticket ? ' ' + ticket(a.ticket || STATE.prs[a.pr].ticket) : '');
  const draft = a.type === 'reply' ? (a.draft ? '<br><span class="muted">' + esc(String(a.draft).slice(0, 160)) + '</span>' : a.payload ? '<br><span class="muted">draft in ' + esc(a.payload) + '</span>' : '') : '';
  const status = a.voided_at ? '<span class="muted">voided</span>' : a.consumed_at ? esc(a.approved_at) + ' <span class="muted">(used)</span>'
    : a.approved_at ? 'approved ' + esc(a.approved_at) + (a.type === 'reply' ? ' <span class="muted">· reply not posted yet</span>' : '') : a.type === 'send' ? '<span class="muted">legacy send entry</span>' : '<b>pending</b>';
  return '<tr><td class="k">' + esc(a.id) + '</td><td>' + esc(a.type) + '</td><td class="k">' + subject + draft + '</td><td class="muted">' + esc(a.created_at) + '</td><td class="k">' + (a.approved_at || a.voided_at ? '' : esc(approveLine(a))) + '</td><td>' + status + '</td></tr>';
}
function awaiting() {
  const all = STATE.awaiting_human || [], open = all.filter(openEntry), history = all.filter(a => !openEntry(a));
  const table = rows => '<div class="scroll"><table><thead><tr><th>Id</th><th>Kind</th><th>Subject</th><th>Created</th><th>Approve line</th><th>Status</th></tr></thead><tbody>' + rows.map(awaitingRow).join('') + '</tbody></table></div>';
  document.getElementById('awaiting').innerHTML = (open.length ? table(open) : '<p class="muted">nothing waits for a human</p>') +
    (history.length ? '<details><summary>History (' + history.length + ')</summary>' + table(history) + '</details>' : '');
}
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { view.tab = b.dataset.tab; show(); writeHash(); }));
document.querySelectorAll('#tiles .tile').forEach(b => b.addEventListener('click', () => tileClick(b.dataset.tile)));
function legend() {
  document.getElementById('legend').innerHTML = '<b>Jira mapping:</b> ' + PR_STATES.map(s => badge(s) + ' → ' + esc(JIRA[s])).join(' &nbsp; ') +
    '<br><b>Gates:</b> ✓ evidence for the current head · ✗ stale or failed · — none. REWORK rows read "reviewer not notified" until replies are posted: self-resolved threads get the agent\'s reply at once, threads that need the lead wait for the lead\'s word on their own reply entry; once every thread has its reply and Copilot (or the gate) is clean on the head, the agents re-request the thread authors on GitHub. A push-only rework pings nobody: its row reads "reviewers not notified" and the lead decides. A thread author who approved the head is never re-requested. Answered threads the reviewer has not resolved do not hold APPROVED back: the row reads "n thread(s) answered, awaiting resolve".' +
    '<br><b>Awaiting humans:</b> only what still needs a person — open entries with their approve line, and approved replies not yet on GitHub; everything approved, used or voided sits under History.' +
    '<br><b>Bugs:</b> todo → ai (an agent is fixing) → testing (deployed, waiting for a re-test) → done. The dropdown writes to the board database; the orchestrator folds it back with <span class="k">turnstile bug set</span>.' +
    '<br><b>Progress:</b> a snapshot of state.json — completion and bars by state (click a story\'s segment to filter the PRs tab), gates per story, and days in state for every open PR (from state_since; older records fall back to the newest of rework_since, the send and the head check). READY / ON_HUMAN_REVIEW / REWORK rows at 3+ days are tinted.';
}
if (STATE) { document.getElementById('title').textContent = 'Turnstile — ' + (STATE.epic || {}).key; renderMembers(); tiles(); prs(); stories(); bugs(); awaiting(); progress(); legend();
  if (location.hash) applyHash(); window.addEventListener('hashchange', applyHash);
  if (window.claude && typeof window.claude.use === 'function') { connectBugsDb(); } else { window.addEventListener('load', () => { if (window.claude && typeof window.claude.use === 'function') connectBugsDb(); }); } }
</script>
</body>
